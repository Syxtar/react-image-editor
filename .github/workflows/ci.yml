name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build -w @ascentsparksoftware/react-image-editor
      - run: npm test
      - run: npm run build -w demo

  e2e:
    name: playwright e2e + visual smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @ascentsparksoftware/react-image-editor
      - run: npx playwright install --with-deps chromium
      # --update-snapshots=missing: visual baselines are platform-specific; when a
      # linux baseline is not checked in yet the shot is recorded instead of failing,
      # so the visual suite is a render smoke until linux baselines are committed.
      - run: npm run e2e -- --update-snapshots=missing
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # test-results holds the per-test *-actual.png shots — the source for
          # refreshing the runner-environment visual baselines when they drift.
          path: |
            playwright-report/
            test-results/
          retention-days: 7
